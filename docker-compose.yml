name: karapardaz

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://karapardazavand.ir}
    image: ${KARAPARDAZ_IMAGE:-karapardaz-web:latest}
    container_name: karapardaz-web
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      # Expose on localhost 3001 so it can be reached via host or internal docker network
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://karapardazavand.ir}
    networks:
      - amlak-net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  amlak-net:
    name: ${AMLAK_NETWORK:-amlak_amlak-net}
    external: true

